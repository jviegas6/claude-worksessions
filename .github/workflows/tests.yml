name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y zsh
      - run: pip install pytest pytest-cov
      # fail_under = 95 in pyproject.toml makes this fail when coverage drops below 95%
      - run: pytest
