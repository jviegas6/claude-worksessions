name: release

# A merged PR that changes VERSION is a release: tag the merge commit vX.Y.Z and
# publish the GitHub release with that version's CHANGELOG section.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already tagged"; exit 0
          fi
          awk "/^## \\[$v\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $v"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$v" -m "v$v"
          git push origin "v$v"
          gh release create "v$v" --title "v$v" --notes-file notes.md --latest
